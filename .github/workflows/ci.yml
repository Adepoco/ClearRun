name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Lint ClearRun action metadata
        run: node scripts/lint_action_yml.js

      - name: Test ClearRun action script
        run: node --test action/test/score.test.js

      - name: Install dependencies
        run: npm ci

      - name: Typecheck workspace packages
        run: npm run typecheck

      - name: Run SDK tests
        run: npm run test:sdk

      - name: Run CLI tests
        run: npm run test:cli

      - name: Run MCP tests
        run: npm run test:mcp

      - name: Validate public verdict schema
        run: npm run validate:schema
